name: Agent tracking

on:
  issues:
    types: [opened, edited, labeled, unlabeled, reopened, closed, transferred]
  # Execute trusted default-branch publisher code, never PR head code.
  pull_request_target:
    types: [closed, reopened, synchronize, edited]
  push:
    branches: [main]
  # Backlog membership has its own reconciliation, independent of freshness.
  schedule:
    - cron: '17 * * * *'
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      event:
        description: Bounded tracker event envelope from the shared command
        required: true
        type: string

permissions:
  contents: read

# Keep at most one running and one newest pending automatic wakeup per kind.
# Every explicit command retains its own workflow and acknowledgement. Activity
# cannot displace fact reconciliation; both keep their existing schedule.
concurrency:
  group: agent-tracking-wakeup-${{ github.repository }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || (github.event.schedule == '*/5 * * * *' && 'activity' || 'facts') }}
  cancel-in-progress: false

jobs:
  publish:
    # Every registry/Project writer retains the same non-cancelling queue.
    # Surviving passive wakeups always read current facts when admitted.
    concurrency:
      group: agent-tracking-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply intent and publish the latest confirmed state
        env:
          GH_TOKEN: ${{ secrets.AGENT_TRACKER_TOKEN }}
          TRACKER_SCHEDULE: ${{ github.event.schedule }}
          TRACKER_EVENT: ${{ inputs.event }}
        run: node scripts/agent-tracker.mjs worker
