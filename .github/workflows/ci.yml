name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: package-lock.json matches package.json
        run: |
          npm install --package-lock-only --ignore-scripts
          git diff --exit-code package-lock.json

      - name: Migrations already on main are unchanged
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only --diff-filter=MDR "origin/${{ github.base_ref }}...HEAD" -- supabase/migrations)
          if [ -n "$changed" ]; then
            echo "A migration on main is history; add a new migration instead. Changed:"
            echo "$changed"
            exit 1
          fi

      - name: Start local Supabase
        run: npm run db:start -- -x studio,mailpit,logflare,vector,edge-runtime,imgproxy,supavisor

      - name: Generated database types match the migrations
        run: |
          npm run db:types
          git diff --exit-code src/lib/database.types.ts

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    # Installing Chromium and starting the complete Supabase/Next.js/Postman
    # acceptance stack consume several minutes before the serial suite begins.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Postman CLI
        run: |
          npm install --global postman-cli@1.73.0
          postman --version
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_PRODUCTION_SERVER: "1"
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results
          if-no-files-found: ignore
