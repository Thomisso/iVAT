name: CI

on:
  workflow_call:
    inputs:
      candidate-full:
        type: boolean
        default: true
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  pull-requests: read

# Only PR revisions supersede each other. Main evidence and release preparation
# must remain available for their exact commit, even after a newer main push.
concurrency:
  group: ci-${{ github.workflow }}-${{ (!(!inputs['candidate-full'] && github.event_name == 'pull_request' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name && github.event.label.name != 'ci:full' ) && github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !(!inputs['candidate-full'] && github.event_name == 'pull_request' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name && github.event.label.name != 'ci:full') }}

jobs:
  profile:
    name: CI profile
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.profile.outputs.profile }}
      plan: ${{ steps.profile.outputs.plan }}
      run: ${{ steps.selection.outputs.run }}
      reuse: ${{ steps.diagnostic.outputs.reuse }}
      diagnostic: ${{ steps.diagnostic.outputs.diagnostic }}
      common: ${{ steps.selection.outputs.common }}
      tracker: ${{ steps.selection.outputs.tracker }}
      release: ${{ steps.selection.outputs.release }}
      application: ${{ steps.selection.outputs.application }}
      http: ${{ steps.selection.outputs.http }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: node --test scripts/tests/ci-policy.test.mjs scripts/tests/ci-scopes.test.mjs scripts/tests/ci-main.test.mjs scripts/tests/ci-pr-events.test.mjs scripts/tests/ci-pr-evidence.test.mjs scripts/tests/ci-timings.test.mjs scripts/tests/http-acceptance-policy.test.mjs scripts/tests/operational-bulk-diagnostic.test.mjs
      - id: profile
        name: Select verification plan
        env:
          CI_CANDIDATE_FULL: ${{ inputs['candidate-full'] }}
        run: node scripts/ci-policy.mjs
      - id: selection
        run: node scripts/ci-pr-evidence.mjs select
        env:
          CI_CANDIDATE_FULL: ${{ inputs['candidate-full'] }}
          PLAN: ${{ steps.profile.outputs.plan }}
          GH_TOKEN: ${{ github.token }}
          PR_WORKFLOW_FILE: ci.yml
      - id: diagnostic
        name: Temporary exact-branch diagnostic selection
        run: node scripts/operational-bulk-diagnostic.mjs
        env:
          IVAT_OPERATIONAL_DIAGNOSTIC_MODE: post_cleanup_catalog_344
          PR_REUSE: ${{ steps.selection.outputs.reuse }}
      - name: Migrations already on main are unchanged
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only --diff-filter=MDR "$BASE_SHA...HEAD" -- supabase/migrations)
          if [ -n "$changed" ]; then
            echo "A migration on main is history; add a new migration instead. Changed:"
            echo "$changed"
            exit 1
          fi

  tracker:
    needs: profile
    if: needs.profile.outputs.tracker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Agent tracker command behavior
        run: npm run test:agent-tracker
      - name: Install Postman CLI for tracker transport
        timeout-minutes: 5
        run: |
          npm install --global postman-cli@1.73.0
          postman --version
      - name: Agent tracker through real gh and controlled GitHub HTTP
        timeout-minutes: 5
        run: node scripts/verify-agent-tracker-transport.mjs

  common:
    needs: profile
    if: needs.profile.outputs.common == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Application shard coverage and measured allocation
        run: node --test scripts/tests/application-shards.test.mjs
      - name: package-lock.json matches package.json
        run: |
          npm install --package-lock-only --ignore-scripts
          git diff --exit-code package-lock.json

      - name: Safe local CLI output
        run: node --test scripts/tests/cli-*.test.mjs

      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint

  release:
    needs: profile
    if: needs.profile.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Postman CLI for release dependency simulations
        timeout-minutes: 5
        run: |
          npm install --global postman-cli@1.73.0
          postman --version
      - name: Release policy, bundle integrity, transport and host preflight
        timeout-minutes: 5
        run: node --test scripts/tests/release-identity.test.mjs deploy/tests/release-prepare.test.mjs deploy/tests/release-evidence.test.mjs deploy/tests/release-host.test.mjs deploy/tests/release-connect.test.mjs deploy/tests/release-runtime.test.mjs

  full:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    needs: profile
    if: needs.profile.outputs.application == 'true' && needs.profile.outputs.diagnostic != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Reserve Supabase ports before network setup
        run: |
          reserved=$(sysctl -n net.ipv4.ip_local_reserved_ports)
          sudo sysctl -w "net.ipv4.ip_local_reserved_ports=${reserved:+$reserved,}54320-54329"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Install PDF renderer
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Start local Supabase
        id: supabase
        run: npm run db:start -- --profile=e2e

      - name: Diagnose Supabase startup port conflicts
        if: failure() && steps.supabase.outcome == 'failure'
        run: |
          sudo ss -tanp '( sport >= :54320 and sport <= :54329 )'
          docker ps -a --format '{{.Names}} {{.Status}} {{.Ports}}'

      # Shard 1 owns this shared check using its already-required database.
      - name: Generated database types match the migrations
        if: matrix.shard == 1
        run: |
          npm run db:types
          git diff --exit-code src/lib/database.types.ts

      # Each shard owns its runner/database; files within it remain serial.
      - name: Complete application shard
        run: npm run test:serial -- --shard=${{ matrix.shard }}/3
        env:
          IVAT_OPERATIONAL_BULK_CAPTURE: "1"
          IVAT_DOCUMENT_OVERVIEW_FAILURE_CAPTURE: "1"
      - name: Upload sanitized operational bulk capture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: operational-bulk-capture-${{ matrix.shard }}
          path: |
            test-results/operational-bulk-capture/capture.jsonl
            test-results/operational-bulk-capture/request.jsonl
            test-results/operational-bulk-capture/postgres.jsonl
            test-results/operational-bulk-capture/waits.jsonl
            test-results/operational-bulk-capture/catalog.jsonl
            test-results/document-overview-failure.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Stop the disposable database
        if: always()
        run: npm run db:stop -- --no-backup

  # Temporary observation only. A skipped full matrix keeps check FAILED and
  # PR verification evidence SKIPPED; these 89 cases cannot approve the app.
  operational-bulk-diagnostic:
    name: Operational bulk diagnostic (89 cases; no full verification)
    needs: profile
    if: needs.profile.outputs.diagnostic == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Reserve Supabase ports before network setup
        run: |
          reserved=$(sysctl -n net.ipv4.ip_local_reserved_ports)
          sudo sysctl -w "net.ipv4.ip_local_reserved_ports=${reserved:+$reserved,}54320-54329"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install PDF renderer
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Prove exact diagnostic inventory before database startup
        run: |
          npx vitest list --config vitest.operational-bulk-diagnostic.config.ts tests/operational-email-alerts.test.ts --filesOnly --json > /tmp/operational-diagnostic-files.json
          npx vitest list --config vitest.operational-bulk-inventory.config.ts tests/operational-email-alerts.test.ts --no-static-parse --json > /tmp/operational-diagnostic-cases.json
          node scripts/operational-bulk-diagnostic.mjs inventory /tmp/operational-diagnostic-files.json /tmp/operational-diagnostic-cases.json
      - name: Start local Supabase
        run: npm run db:start -- --profile=e2e
      - name: Generated database types match the migrations
        run: |
          npm run db:types
          git diff --exit-code src/lib/database.types.ts
      - name: Observe only the 89 operational cases
        run: npx vitest run --config vitest.operational-bulk-diagnostic.config.ts tests/operational-email-alerts.test.ts --maxWorkers=1
        env:
          IVAT_OPERATIONAL_BULK_CAPTURE: "1"
          IVAT_DOCUMENT_OVERVIEW_FAILURE_CAPTURE: "1"
          IVAT_POST_CLEANUP_CATALOG: "1"
          IVAT_OPERATIONAL_DIAGNOSTIC_MODE: post_cleanup_catalog_344
      - name: Upload sanitized focused diagnostic capture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: operational-bulk-capture-focused
          path: |
            test-results/operational-bulk-capture/capture.jsonl
            test-results/operational-bulk-capture/request.jsonl
            test-results/operational-bulk-capture/postgres.jsonl
            test-results/operational-bulk-capture/waits.jsonl
            test-results/operational-bulk-capture/catalog.jsonl
            test-results/document-overview-failure.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Stop the disposable diagnostic database
        if: always()
        run: npm run db:stop -- --no-backup

  acceptance:
    needs: profile
    if: needs.profile.outputs.http == 'true'
    runs-on: ubuntu-latest
    # One actual production HTTP suite owns one isolated stack.
    # The three financial application-test shards above remain independent.
    timeout-minutes: 30
    steps:
      - name: Reserve Supabase ports before network setup
        run: |
          reserved=$(sysctl -n net.ipv4.ip_local_reserved_ports)
          sudo sysctl -w "net.ipv4.ip_local_reserved_ports=${reserved:+$reserved,}54320-54329"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Postman CLI
        run: |
          npm install --global postman-cli@1.73.0
          postman --version
      - name: Install PDF renderer
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Production HTTP acceptance
        run: npm run test:http
      - name: Upload HTTP acceptance service logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: http-acceptance-logs
          path: test-results
          if-no-files-found: ignore
      - name: Stop the acceptance database
        if: always()
        run: npm run db:stop -- --no-backup

  check:
    name: ${{ (!inputs['candidate-full'] && github.event_name == 'pull_request' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name && github.event.label.name != 'ci:full') && 'Administrative label (check)' || 'check' }}
    if: ${{ always() && !(!inputs['candidate-full'] && github.event_name == 'pull_request' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name && github.event.label.name != 'ci:full') }}
    needs: [profile, tracker, release, common, full]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Enforce verification gate
        run: node scripts/ci-policy.mjs gate
        env:
          PLAN: ${{ needs.profile.outputs.plan }}
          PR_REUSE: ${{ needs.profile.outputs.reuse }}
          GH_TOKEN: ${{ github.token }}
          PR_WORKFLOW_FILE: ci.yml
          GATE: check
          RESULTS: '{"policy": "${{ needs.profile.result }}", "tracker": "${{ needs.tracker.result }}", "trackerTransport": "${{ needs.tracker.result }}", "release": "${{ needs.release.result }}", "common": "${{ needs.common.result }}", "application": "${{ needs.full.result }}"}'

  e2e:
    name: ${{ (!inputs['candidate-full'] && github.event_name == 'pull_request' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name && github.event.label.name != 'ci:full') && 'Administrative label (e2e)' || 'e2e' }}
    if: ${{ always() && !(!inputs['candidate-full'] && github.event_name == 'pull_request' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name && github.event.label.name != 'ci:full') }}
    needs: [profile, common, acceptance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Enforce verification gate
        run: node scripts/ci-policy.mjs gate
        env:
          PLAN: ${{ needs.profile.outputs.plan }}
          PR_REUSE: ${{ needs.profile.outputs.reuse }}
          GH_TOKEN: ${{ github.token }}
          PR_WORKFLOW_FILE: ci.yml
          GATE: e2e
          RESULTS: '{"policy": "${{ needs.profile.result }}", "common": "${{ needs.common.result }}", "http": "${{ needs.acceptance.result }}"}'

  pr-evidence:
    name: PR verification evidence
    if: ${{ always() && !inputs['candidate-full'] && github.event_name == 'pull_request' && needs.profile.outputs.reuse == '' && needs.profile.outputs.application == 'true' && needs.check.result == 'success' && needs.e2e.result == 'success' }}
    needs: [profile, tracker, release, common, full, acceptance, check, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/ci-pr-evidence.mjs record
        env:
          PLAN: ${{ needs.profile.outputs.plan }}
          RESULTS: '{"policy": "${{ needs.profile.result }}", "tracker": "${{ needs.tracker.result }}", "trackerTransport": "${{ needs.tracker.result }}", "release": "${{ needs.release.result }}", "common": "${{ needs.common.result }}", "application": "${{ needs.full.result }}", "http": "${{ needs.acceptance.result }}"}'
          PR_REUSE: ${{ needs.profile.outputs.reuse }}
          GH_TOKEN: ${{ github.token }}
          PR_WORKFLOW_FILE: ci.yml
      - uses: actions/upload-artifact@v7
        with:
          name: pr-verification-${{ github.run_attempt }}
          path: pr-verification.json
          retention-days: 7
          if-no-files-found: error
