purpose:
  stands_in_for: The consumed GitHub REST and Projects GraphQL storage/transport paths used by the real agent-tracker controller and serialized worker.
  unblocks: Exercise real gh HTTP/TLS serialization, permission refusal, provider rejection, ambiguous create responses and retry of partial Project publication without a real GitHub credential or modifying live issues.
assumptions:
  - id: provider-contract-subset
    status: supported
    claim: The modelled calls use the provider's documented issue-comment, workflow-dispatch and Projects field/item request and response shapes.
    reason: The fixture implements only the paths and GraphQL operations consumed by the caller; unknown paths return 501 rather than inventing successful behavior. It is locally authored from provider documentation, not an owner-published Postman resource.
    verification: Read the official Projects GraphQL, issue-comment and workflow-dispatch contracts on 2026-11-04. Signed-in owner discovery was skipped because Postman whoami reports no account; postman status is unavailable in CLI 1.73.0. A simulation pass does not prove every provider constraint or live permission.
    source: https://docs.github.com/en/graphql/reference/projects; https://docs.github.com/en/rest/issues/comments#update-an-issue-comment; https://docs.github.com/en/rest/actions/workflows#create-a-workflow-dispatch-event; postman/mocks/github-agent/default.js
    updated_at: "2026-11-04"
  - id: real-gh-is-intercepted
    status: supported
    claim: The transport verifier runs the real gh executable through the local Postman HTTPS proxy with an isolated fake credential and per-process CA trust.
    reason: The verifier overrides GH_TOKEN, isolates GH_CONFIG_DIR, and sets proxy and SSL_CERT_FILE only for child commands. Its initial user request returns the synthetic fixture identity and the proxy log records api.github.com traffic.
    verification: On the agent-tracking-201-development fingerprint, the initial wire probe and the complete twelve-case verification passed. No insecure TLS switch or real GitHub token was used. Proxy mode in CLI 1.73.0 required UUID id fields for both simulation and mock, resolved mock paths relative to the simulation file, and emitted a human request log despite the earlier --output ndjson attempt.
    source: scripts/verify-agent-tracker-transport.mjs; postman/simulations/github-agent/github-agent.sim.yaml
    updated_at: "2026-11-04"
  - id: controller-and-worker-publication-retry
    status: supported
    claim: Against this HTTP stand-in, the real controller persists a pending dispatch and the real worker retries partial publication without duplicating the issue item or maintained status comment.
    reason: The mock records dispatch intent and stores provider objects only; the verifier invokes the actual worker as a separate process to apply the event. A synthetic field-write failure occurs after canonical intent and Project item creation, leaving publication unacknowledged until a successful retry.
    verification: Repeated successfully on 2026-11-05 against the agent-tracking-203-development fingerprint (13 scenarios, 27 captured requests). This revalidates the existing publication paths only; the new review/dependency GitHub operations are covered by CLI-boundary controlled transport tests and still require isolated live acceptance. The complete verifier passed on 2026-11-04. It observed controller publication_pending, actual worker start, duplicate receipt handling, claim publication failing before field effects, publishedRevision remaining behind revision, then successful retry/sync with one item and one ticket comment. The original state timestamp remained 2026-11-04T12:01:00.000Z. These are caller outcomes under the model, not real Actions concurrency evidence. The unchanged transport suite also passed on 2026-11-05 against the agent-tracking-202-development and agent-tracking-202-readiness-review fingerprints; these runs do not exercise discovery or view APIs. The same 13 foundation scenarios and 27 captured requests passed again for the agent-tracking-202-203-merge fingerprint, without claiming HTTP coverage for new lifecycle or discovery operations.
    source: scripts/verify-agent-tracker-transport.mjs; postman/mocks/github-agent/default.js
    updated_at: "2026-11-05"
  - id: ambiguous-comment-create
    status: supported
    claim: Against this stand-in, setup discovers an already-created registry comment after a failed create response instead of blindly creating a duplicate.
    reason: The fixture saves the comment before returning an injected HTML 502 response. The caller first reports failure, then on retry reads the saved marker and completes setup with one registry comment.
    verification: The seven-case setup probe and later complete twelve-case verifier both passed on 2026-11-04. A prior internal mock error caused by unawaited pm.state was fixed before any passing claim; pm.state access is asynchronous and namespaced as github-agent:snapshot. This test covers a persisted comment-create effect, not every possible ambiguous GitHub mutation.
    source: scripts/verify-agent-tracker-transport.mjs; postman/mocks/github-agent/default.js
    updated_at: "2026-11-04"
  - id: provider-errors-are-distinguished
    status: supported
    claim: Under the modelled failures, the actual caller distinguishes HTTP 403 permission failure, GraphQL UNPROCESSABLE rejection and HTML 502 transport failure without printing the injected private response body.
    reason: The verifier invokes the actual setup/doctor paths and checks their public error codes, while retaining the injected raw marker only inside the local stand-in.
    verification: The complete verifier passed on 2026-11-04 with github_permission_denied, github_request_rejected and github_connection_failed in the corresponding cases. The orchestrator's live setup separately observed GitHub reject the custom field name Reviewer as reserved; the model includes that observed case, while the caller now uses Review agent. Other names are not assumed reserved from that one observation.
    source: scripts/verify-agent-tracker-transport.mjs; postman/mocks/github-agent/default.js; live setup evidence from the #201 implementation session on 2026-11-04
    updated_at: "2026-11-04"
  - id: proxy-negative-serial-compatibility
    status: supported
    claim: A test-only Go compatibility setting permits Postman proxy certificates with negative serial numbers while retaining CA and hostname verification.
    reason: A later real-gh verifier run encountered x509 negative serial number from the freshly generated Postman certificate. Go 1.23 documents GODEBUG=x509negativeserial=1 as a parser compatibility option; it does not disable certificate-chain or hostname validation. The verifier scopes it to its synthetic child environment with a fake token, isolated gh configuration and per-run proxy CA, never production or the user's shell profile.
    verification: The initial negative-serial failure was reported during ticket 201 verification on 2026-11-04. After adding the documented compatibility option, the complete thirteen-case verifier passed once against the current real controller/worker. Its untrusted-CA negative control failed certificate validation as expected before the same caller succeeded using the per-run proxy CA. This is a scoped fixture workaround, not a production TLS change or a certificate-randomness retry.
    source: https://go.dev/doc/godebug; https://pkg.go.dev/crypto/x509#ParseCertificate; scripts/verify-agent-tracker-transport.mjs
    updated_at: "2026-11-04"
  - id: live-actions-and-project-permissions
    status: unknown
    claim: The configured real repository workflow serializes all authority/publication attempts and can mutate the intended user-owned GitHub Project with its stored credential.
    reason: This simulation does not run GitHub Actions and cannot establish upstream scheduling, concurrency, live credential scopes or real Project field/view behavior. Its worker process receives an isolated synthetic Actions context only to exercise actual worker code.
    verification: The local verifier passed its controller/worker HTTP scenarios; real private acceptance-repository Actions runs and live Project inspection must establish this separate condition. No live Actions or permission pass is claimed by this record.
    source: https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency; https://docs.github.com/en/issues/planning-and-tracking-with-projects/automating-your-project/automating-projects-using-actions
    updated_at: "2026-11-04"
  - id: acknowledged-project-field-readback
    status: supported
    claim: The real gh/controller/worker reads acknowledged Project field values during repair and successfully republishes its evidence-backed projection against this stand-in.
    reason: The verifier now dispatches a genuine repair after claim acknowledgment, invokes the actual worker separately, and asserts that TrackerItemFields was observed through real gh HTTP before synchronization succeeds. The mock remains storage/transport only.
    verification: On 2026-11-05 the new assertion first failed because the old mock did not model TrackerItemFields. After adding its documented ProjectV2Item fieldValues response shape, all thirteen existing transport scenarios plus the additional repair readback assertion passed on agent-tracking-206-composition. This does not exercise final PR merge/ready/reversal operations over HTTP or prove live provider permissions/atomicity; their CLI-boundary tests and root-owned isolated GitHub acceptance remain separate.
    source: https://docs.github.com/en/graphql/reference/projects#projectv2item; scripts/verify-agent-tracker-transport.mjs; postman/mocks/github-agent/default.js
    updated_at: "2026-11-05"
  - id: merged-result-without-legacy-rest-field
    status: supported
    claim: The actual public final-pr path binds the corroborated GraphQL merged result when the current REST PR response omits merge_commit_sha.
    reason: REST API 2026-03-10 removed that field. The stand-in supplies distinct head, merge-result and later default-tip identities; the real controller/worker reads both API representations and records only the corroborated result.
    verification: On 2026-11-05 all thirteen existing wire scenarios plus a fourteenth merged-result scenario passed, including the existing Project repair readback assertion. Public CLI process tests also reject inconsistent GraphQL identity and verify completion on the actual result tree. This transport model does not prove actual provider completion or permissions; root-owned live acceptance remains separate.
    source: https://docs.github.com/en/rest/about-the-rest-api/breaking-changes?apiVersion=2026-03-10; scripts/verify-agent-tracker-transport.mjs; scripts/tests/agent-tracker-final.test.mjs; postman/mocks/github-agent/default.js
    updated_at: "2026-11-05"
  - id: direct-entry-provider-facts
    status: supported
    claim: The real gh/controller/worker first-claim path reads native child existence and dependency edges before entering implementation.
    reason: Direct entry shares specification classification and dependency gates with existing tracking paths; the stand-in models these additional GET endpoints as empty native collections for its implementation fixture.
    verification: On 2026-11-05 all fourteen existing transport scenarios passed after extending the consumed first-entry API subset. The verifier explicitly observed GET sub_issues and dependencies/blocked_by for issue 7; public CLI regressions separately exercise nonempty blockers, body/native-child specifications and qualified retained parents. These synthetic outcomes do not establish provider scheduling or live permissions.
    source: https://docs.github.com/en/rest/issues/sub-issues#list-sub-issues; https://docs.github.com/en/rest/issues/issue-dependencies#list-dependencies-an-issue-is-blocked-by; scripts/verify-agent-tracker-transport.mjs; scripts/tests/agent-tracker-entry.test.mjs; postman/mocks/github-agent/default.js
    updated_at: "2026-11-05"
  - id: unchanged-projection-skips-mutations
    status: supported
    claim: Against this stand-in, the actual gh/controller/worker acknowledges an unchanged repair without repeating Project membership/field, issue-assignee or maintained-comment mutations.
    reason: Publication reads actual fields, assignees and comment bodies before selecting effects. The transport verifier observes requests through real gh and asserts zero projection mutations for an acknowledged unchanged repair. The mock stores issue assignees as provider state rather than returning an empty list after every write.
    verification: On 2026-11-09, the new unchanged-repair assertion first failed because the stand-in did not retain assignees. After correcting that storage model, the complete existing transport verifier plus this assertion passed on agent-tracking-246-differential-publication. The complete verifier passed again after merging the reviewed fixture fix on agent-tracking-246-integrated-fixture. Public CLI regressions separately establish duplicate passive wakeups, closure bursts, queued reopen, lost field responses, owned stop identity and missing membership/comment/view repairs. This HTTP run does not exercise discovery/view effects or real Actions queue coalescing; controller-owned live acceptance remains required for provider scheduling and permissions.
    source: scripts/verify-agent-tracker-transport.mjs; scripts/tests/agent-tracker-publication.test.mjs; scripts/tests/agent-tracker-final.test.mjs; postman/mocks/github-agent/default.js
    updated_at: "2026-11-09"
  - id: deleted-item-node-error-repair
    status: supported
    claim: A deleted acknowledged Project item is repaired when GitHub returns data.node null with one NOT_FOUND error at the root node path; unrelated item-read failures remain refusals.
    reason: Controller-supplied provider evidence on 2026-11-10 showed real gh exits one for this deleted-node response, so the earlier null-without-errors model concealed a failure before durable reconciliation intent. The dedicated Project-item reader now owns its fixed query and accepts only that narrow absence response, while permission diagnostics retain precedence and other GraphQL calls retain their existing behavior.
    verification: "On the agent-tracking-254-deleted-node fingerprint, the public CLI missing-membership test first failed with the realistic response and then passed after the boundary correction. The public refusal matrix retains canonical evidence and an unacknowledged intent for permission, mixed, wrong-path, non-null, malformed and transient failures, then publishes the same envelope after resolution. The real gh/controller/worker verifier passed through the local HTTPS proxy: permission/mixed/wrong-path item errors refused without altering canonical state, then deleting the stored item returned the provider-shaped error and retrying the same original event restored one new item and one maintained comment with the original phase and timestamp. No live credential, Project mutation or Actions run was used by this worker; root-owned live retry remains separate."
    source: scripts/agent-tracking/github.mjs; scripts/agent-tracking/publisher.mjs; scripts/tests/agent-tracker-publication.test.mjs; scripts/verify-agent-tracker-transport.mjs; postman/mocks/github-agent/default.js; controller read-only deleted-node GraphQL evidence from the specification 254 implementation session on 2026-11-10
    updated_at: "2026-11-10"
  - id: tooling-264-existing-wire-scenarios
    status: supported
    claim: The updated tracker CLI and worker pass the existing foundation transport scenarios against the local GitHub stand-in.
    reason: The real gh executable used an isolated synthetic credential and per-process proxy CA; the verifier asserted caller outcomes and observed api.github.com requests in the Postman proxy log. This establishes compatibility with the modelled transport subset, not live provider scheduling or the new guarded finalize protocol over HTTP.
    verification: On 2026-11-10 the complete verifier passed at clean candidate 9e46cda21fda08e06f45dec370552892c46feee1, fingerprint agent-tooling-264-preflight. Its summary reported 17 scenarios, 11 fields and 27 captured requests, covering permission and TLS refusals, partial publication, original envelope retry, deleted-item repair, unchanged projection effects and corroborated GraphQL merged results. The new finalize orchestration and expected-revision guards are covered separately by public CLI process tests with the controlled gh boundary; this wire run does not claim to exercise them. The production codeRef requires the updated worker before accepting those guarded envelopes.
    source: scripts/verify-agent-tracker-transport.mjs; scripts/tests/agent-tracker-finalize.test.mjs; postman/mocks/github-agent/default.js; https://github.com/Thomisso/iVAT/pull/263
    updated_at: "2026-11-10"
  - id: disconnected-history-compare-404
    status: supported
    claim: GitHub compare can return HTTP 404 for two readable commits with no common ancestor after a history rewrite.
    reason: A read-only live probe confirmed both commit reads and a self-comparison succeed while the old/new comparison returns No common ancestor. The caller must distinguish stale history from loss of repository access.
    verification: On 2026-11-11, real gh returned 200 for both commits and the self-comparison, and 404 for their disconnected comparison. The minimized production caller failed before the fix and then returned revision_not_in_history. Public CLI/Git fixture regressions passed for retained and removed historical objects, invalidated delivery, blocked dependent readiness and stopped the original owner. The existing HTTPS simulation verifier passed all 17 foundation scenarios with 27 captured requests; it does not model these Git graph paths. Removed-object behavior is controlled fixture evidence, not a live deletion experiment.
    source: scripts/agent-tracking/evidence.mjs; scripts/tests/agent-tracker-final.test.mjs; scripts/tests/agent-tracker-history.test.mjs; scripts/tests/support/agent-tracker-gh.mjs; scripts/verify-agent-tracker-transport.mjs
    updated_at: "2026-11-11"
