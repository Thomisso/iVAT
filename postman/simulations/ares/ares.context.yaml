purpose:
  stands_in_for: ARES economic-subject lookup used by Company onboarding.
  unblocks: Deterministic CLI HTTP verification of structured registered-address prefill without live-service calls; earlier browser evidence is retained below.
assumptions:
  - id: structured-address-response
    status: unknown
    claim: A successful ARES economic-subject response can provide street name, house number, optional orientation number including a letter, city, and postal code as separate values.
    reason: The local stand-in models the fields consumed by iVAT and proves the caller preserves them, but a stand-in does not establish the live provider contract.
    verification: On 2026-10-28 the focused browser run sent the real Next server's GET through the Postman simulation and received the modelled structured payload. This proves the caller path against the stand-in, not the live provider contract.
    source: src/ares/registry.ts; tests/contract/ares.test.ts; postman/mocks/ares/default.js
    updated_at: "2026-10-28"
  - id: onboarding-preserves-structured-address
    status: supported
    claim: Against the local ARES stand-in, Company onboarding preserves street name, house number, orientation number with a letter, city, and postal code as separate form values.
    reason: The Postman request log showed the dependency path was exercised, and Playwright asserted each visible form field before saving.
    verification: On 2026-10-30, QA v3 verification observed two Postman request events (readiness and onboarding lookup). Both Company onboarding scenarios passed, and the final complete production E2E suite passed 31/31. This revalidates the local caller path, not the live ARES contract.
    source: e2e/company-onboarding.spec.ts; postman/mocks/ares/default.js; integration f4d56c1 (QA v3 #115)
    updated_at: "2026-10-30"
  - id: company-person-identity-contract
    status: supported
    claim: The ARES summary exposes a Company legal-form code, and the RŽP primary entrepreneur record can expose first and last names separately; neither identifies the Company's intended export signatory.
    reason: Official OpenAPI schemas distinguish EkonomickySubjektZaklad.pravniForma, ZaznamRzp.osobaPodnikatel and the separate angazovaneOsoby list. The adapter accepts only a uniquely primary matching entrepreneur and leaves missing values editable.
    verification: On 2026-10-30 read the official OpenAPI and queried the official res PravniForma catalogue. The explicit opt-in live ARES contract test passed for legal-person IČO 27082440. No live natural-person completeness claim is made. Orbit discovery returned unrelated providers, so the authoritative ARES contract supplied the integration evidence.
    source: https://ares.gov.cz/ekonomicke-subjekty-v-be/rest/v3/api-docs; POST https://ares.gov.cz/ekonomicke-subjekty-v-be/rest/ciselniky-nazevniky/vyhledat with kodCiselniku PravniForma and zdrojCiselniku res; docs/ares-company-identity.md; tests/contract/ares.test.ts
    updated_at: "2026-10-30"
  - id: identity-prefill-local-browser
    status: supported
    claim: Against the local stand-in, onboarding and Company settings prefill the person type and structured natural-person name, permit edits and manual fallback, and leave signatory entry independent.
    reason: Focused Playwright journeys exercised legal, natural, incomplete and unavailable responses using the real Next application. Agent-browser independently displayed the Czech natural-person fields and React CompanyIdentityFields state. Postman request events confirmed the summary and RŽP HTTP paths ran.
    verification: On 2026-10-30 ticket 134 at base 3b168cf with implementation changes passed all three company-onboarding Playwright journeys and 39 focused ARES/Company/filing-defaults tests. Next MCP reported no compilation or runtime errors. The simulation proves caller behavior under modelled responses, not live registry completeness or availability. QA v5 ticket 160 revalidated the three onboarding journeys with private account provisioning and real UI login while public Auth signup was disabled. A production-mode subset also passed all 12 accounting, security, Company and invitation journeys; captured Postman events included the summary and RŽP routes with 200 responses and the unavailable summary response with 503. This revalidates local caller behavior, not live ARES behavior.
    source: e2e/company-onboarding.spec.ts; tests/ares.test.ts; postman/mocks/ares/default.js; src/ares/registry.ts
    updated_at: "2026-10-30"
  - id: cli-http-identity-and-refusal
    status: unknown
    claim: The production HTTP acceptance harness can reuse the existing stand-in through the real ARES adapter for structured natural-person identity and an unavailable-provider refusal.
    reason: The new CLI acceptance source uses the existing adapter, simulation and modelled responses; runtime execution has not yet occurred on this candidate.
    verification: On 2026-11-07 prepared the production HTTP harness and read the existing adapter/stand-in contract. Runtime verification awaits an isolated database lease. No live ARES, UI interaction or current runtime pass is claimed.
    source: acceptance/auth-http.test.ts; scripts/e2e.mjs; src/ares/registry.ts; postman/mocks/ares/default.js
    updated_at: "2026-11-07"
