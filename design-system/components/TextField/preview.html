<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>TextField — preview</title></head>
<body>
<div id="root" class="iv-demo"></div>
<script>
var I = window.iVAT, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))', gap: 12 } },
  h(I.TextField, { label: 'Company name', defaultValue: 'Pekárna U Mlýna s.r.o.' }),
  h(I.TextField, { label: 'IČO', mono: true, defaultValue: '2708244', error: 'IČO must have 8 digits.' }),
  h(I.TextField, { label: 'VAT ID', mono: true, defaultValue: 'CZ27082440', hint: 'CZ followed by 8 to 10 digits.' })));
</script>
</body>
</html>
