<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iVAT</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--canvas); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .ledger { fill:var(--accent); }
  .sheet { fill:var(--ink); }
  .mark { fill:var(--ai-mark); }
  .rule { stroke:var(--line-strong); stroke-width:1; }
  .blk { rx:var(--radius-lg); }
  .stroke { rx:var(--radius-sm); }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-size:120px; line-height:.9; font-weight:600; letter-spacing:-.03em; color:var(--ink); }
  .tag { margin:var(--space-2) 0 0 6px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      accent 128x248 slab bled off the top (ledger blue, the action colour) · ink 336x248 sheet bled off the right edge (the document) · ai-mark 128x24 bar under the slab (the marker) — about 40% of 960x288
  arrangement one ledger slab beside one document sheet, bottoms on one line space-4 above the edge, space-4 gutter
  pattern     highlighter strokes, from "the AI writes in marker, people write in ink": ai-mark strokes on five ruled rows of the sheet, like extracted fields on an invoice
  scales      rows at row-compact pitch (36); strokes 16 tall, corners radius-sm; blocks radius-lg; gutters space-4; inset space-6
-->
<rect class="ledger blk" x="16" y="-16" width="128" height="248" rx="10"/>
<rect class="mark stroke" x="16" y="248" width="128" height="24" rx="4"/>
<rect class="sheet blk" x="160" y="24" width="336" height="248" rx="10"/>
<line class="rule" x1="184" y1="72" x2="480" y2="72"/>
<line class="rule" x1="184" y1="108" x2="480" y2="108"/>
<line class="rule" x1="184" y1="144" x2="480" y2="144"/>
<line class="rule" x1="184" y1="180" x2="480" y2="180"/>
<line class="rule" x1="184" y1="216" x2="480" y2="216"/>
<rect class="mark stroke" x="184" y="48" width="112" height="16" rx="4"/>
<rect class="mark stroke" x="184" y="84" width="64" height="16" rx="4"/>
<rect class="mark stroke" x="264" y="84" width="120" height="16" rx="4"/>
<rect class="mark stroke" x="344" y="120" width="112" height="16" rx="4"/>
<rect class="mark stroke" x="184" y="156" width="144" height="16" rx="4"/>
<rect class="mark stroke" x="376" y="192" width="80" height="16" rx="4"/>
<rect class="mark stroke" x="184" y="232" width="48" height="16" rx="4"/>
</svg>
</div>
<div class="words">
<h1 class="name">iVAT</h1>
<p class="tag">The AI writes in marker. People write in ink.</p>
</div>
</div>
</body>
</html>
