<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>DataTable — preview</title></head>
<body>
<div id="root" class="iv-demo"></div>
<script>
var I = window.iVAT, h = React.createElement;
var rows = [
  { id: 1, no: 'FV-2026-00412', sup: 'Tiskárna Novák s.r.o.', date: '14. 10. 2026', st: 'proposed', total: 24200 },
  { id: 2, no: '2026/1187', sup: 'Pekárna U Mlýna s.r.o.', date: '12. 10. 2026', st: 'needs-review', total: 3136 },
  { id: 3, no: 'DB-0042', sup: 'Kancelářské potřeby Brno s.r.o.', date: '09. 10. 2026', st: 'approved', total: -2420 },
  { id: 4, no: 'FV-2026-00398', sup: 'Tiskárna Novák s.r.o.', date: '30. 09. 2026', st: 'duplicate', total: 24200 }
];
ReactDOM.createRoot(document.getElementById('root')).render(h(I.DataTable, { caption: 'Received documents', selectedId: 1, rows: rows, columns: [
  { key: 'no', header: 'Number', mono: true },
  { key: 'sup', header: 'Supplier', render: function (r) { return h('a', { href: '#' }, r.sup); } },
  { key: 'date', header: 'Tax Point Date', muted: true },
  { key: 'st', header: 'Status', render: function (r) { return h(I.StatusBadge, { status: r.st }); } },
  { key: 'total', header: 'Total, CZK', align: 'right', render: function (r) { return h(I.Money, { amount: r.total, currency: '' }); } }
] }));
</script>
</body>
</html>
